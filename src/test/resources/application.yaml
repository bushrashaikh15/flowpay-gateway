spring:

  datasource:
    url: jdbc:h2:mem:flowpay_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  h2:
    console:
      enabled: false


flowpay:

  webhook:
    secret: test-webhook-secret